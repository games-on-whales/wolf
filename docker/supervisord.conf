; Supervises the processes that make up Wolf: PulseAudio, Wolf, and the Wolf Den
; management UI. Drop in another [program:...] block to add more.
;
; Env (PULSE_SERVER, WOLF_EMBED_PULSE, WOLF_EMBED_DEN, ...) is exported by
; startup.sh and inherited here. Program logs go to the container stdout/stderr.

[supervisord]
nodaemon=true
user=root
; nodaemon already mirrors supervisord's own log to the console, so send the
; file copy to /dev/null to avoid duplicate lines in `docker logs`.
logfile=/dev/null
loglevel=info
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; PulseAudio, started before Wolf and restarted if it ever dies at runtime.
; autostart is gated on WOLF_EMBED_PULSE so an external PULSE_SERVER is left alone.
; -n: skip the distro default.pa; auth-anonymous=1: let app containers connect
; without a cookie; exit-idle-time=-1: never shut down on its own.
[program:pulseaudio]
command=pulseaudio -n --daemonize=false --fail=false --exit-idle-time=-1 --load="module-native-protocol-unix auth-anonymous=1 socket=%(ENV_PULSE_SERVER)s" --load=module-always-sink --log-target=stderr
autostart=%(ENV_WOLF_EMBED_PULSE)s
autorestart=true
priority=10
stdout_logfile=NONE
stdout_logfile_maxbytes=0
stderr_logfile=NONE
stderr_logfile_maxbytes=0

; Wolf. When we manage PulseAudio, wait for its socket before starting so Wolf
; connects on the first try (the dependency, expressed without a fixed timeout).
; Higher priority than PulseAudio, so on shutdown supervisord stops Wolf first
; (and waits for it) while PA is still up, letting Wolf tear sessions down with
; audio intact before PA goes away.
[program:wolf]
command=bash -c 'if [ "$WOLF_EMBED_PULSE" = true ]; then echo "[wolf] waiting for PulseAudio socket $PULSE_SERVER"; until [ -S "$PULSE_SERVER" ]; do sleep 0.2; done; fi; exec /wolf/wolf'
autostart=true
autorestart=true
startretries=3
; On stop, send Wolf SIGINT so it stops all sessions/containers gracefully, and
; give it up to stopwaitsecs to finish before supervisord SIGKILLs it. The
; command execs Wolf, so the signal reaches it directly (not a bash wrapper).
stopsignal=INT
stopwaitsecs=30
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Wolf Den, the .NET management UI, embedded here instead of the legacy separate
; "wolf-den" container. autostart is gated on WOLF_EMBED_DEN so it can be turned
; off. It waits for Wolf's control socket before starting (the dependency, no
; fixed timeout), and connects to that socket directly via WOLF_SOCKET_PATH
; (a unix:// URI, set per-program so it doesn't clash with the bare path Wolf
; uses to create the socket). Highest priority, so on shutdown supervisord stops
; it first (UI down before Wolf and PulseAudio). Listens on :8080.
[program:wolf-den]
command=bash -c 'sock="${WOLF_SOCKET_PATH#unix://}"; echo "[wolf-den] waiting for Wolf socket $sock"; until [ -S "$sock" ]; do sleep 0.5; done; cd /app && exec dotnet /app/WolfLeash.dll'
autostart=%(ENV_WOLF_EMBED_DEN)s
autorestart=true
startretries=3
priority=30
environment=ASPNETCORE_HTTP_PORTS="8080",WOLF_SOCKET_PATH="%(ENV_WOLF_DEN_SOCKET)s",DOTNET_RUNNING_IN_CONTAINER="true",DOTNET_CLI_HOME="/tmp",HOME="/tmp"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
