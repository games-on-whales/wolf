name: Docker build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - ".github/**"
  release:
    types: [published]

env:
  GPU_DRIVERS_VERSION: 2025.05
  GSTREAMER_VERSION: 1.26.7

jobs:
  buildx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Fedora is the default variant: it gets the plain tags (wolf:beta,
      # wolf:stable, semver...). Ubuntu keeps building under a `-ubuntu`
      # suffix so users can pin the legacy base while migrating.
      matrix:
        include:
          - os: fedora
            tag_suffix: ""
            cache_suffix: ""
            gpu_drivers_file: docker/gpu-drivers-fedora.Dockerfile
            gstreamer_file: docker/gstreamer-fedora.Dockerfile
            wolf_file: docker/wolf-fedora.Dockerfile
          - os: ubuntu
            tag_suffix: "-ubuntu"
            cache_suffix: "-ubuntu"
            gpu_drivers_file: docker/gpu-drivers.Dockerfile
            gstreamer_file: docker/gstreamer.Dockerfile
            wolf_file: docker/wolf.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set derived configuration variables:
      # - images: images to build (docker and/or github)
      # - push: if images need to be uploaded to repository (when secrets available)
      # - has_docker_token
      # - has_github_token
      # - cache_from: image tag to use for imported cache
      # - cache_to: image tag to use for exported cache
      # - github_server_url: reference to source code repository
      - name: Prepare
        id: prep
        run: |
          IMAGES=""
          PUSH=false
          REGISTRY_IMAGE="ghcr.io/${{ github.repository_owner }}/wolf"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            IMAGES="gameonwhales/wolf"
            PUSH=true
            echo "has_docker_token=true" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            if [ "$IMAGES" = "" ]; then
              IMAGES="${REGISTRY_IMAGE}"
            else
              IMAGES="$IMAGES,${REGISTRY_IMAGE}"
            fi
            PUSH=true
            echo "has_github_token=true" >> $GITHUB_OUTPUT
            echo "cache_from=type=registry,ref=${REGISTRY_IMAGE}:buildcache${{ matrix.cache_suffix }}" >> $GITHUB_OUTPUT
            echo "cache_to=type=registry,ref=${REGISTRY_IMAGE}:buildcache${{ matrix.cache_suffix }},mode=max" >> $GITHUB_OUTPUT
          else
            echo "cache_from=type=registry,ref=${REGISTRY_IMAGE}:buildcache${{ matrix.cache_suffix }}" >> $GITHUB_OUTPUT
            echo "cache_to=" >> $GITHUB_OUTPUT
          fi
          echo "images=${IMAGES}" >> $GITHUB_OUTPUT
          echo "push=${PUSH}" >> $GITHUB_OUTPUT
          echo "github_server_url=${GITHUB_SERVER_URL}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          # list of Docker images to use as base name for tags
          images: ${{ steps.prep.outputs.images }}
          # generate Docker tags based on the following events and attributes
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=raw,value=alpha
            type=sha
          flavor: |
            latest=false # let's not produce a :latest tag
            suffix=${{ matrix.tag_suffix }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
          version: latest
          driver-opts: image=moby/buildkit:master

      - name: Login to DockerHub
        if: steps.prep.outputs.has_docker_token != '' # secrets not available in PRs
        uses: docker/login-action@v2
        with:
          username: abeltramo
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Login to GitHub Container Registry
        if: steps.prep.outputs.has_github_token != '' # secrets not available in PRs
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build GPU Drivers
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/
          file: ${{ matrix.gpu_drivers_file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gpu-drivers:${{ env.GPU_DRIVERS_VERSION }}${{ matrix.tag_suffix }},gameonwhales/gpu-drivers:${{ env.GPU_DRIVERS_VERSION }}${{ matrix.tag_suffix }} # TODO: set build version as param
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gpu-drivers:buildcache${{ matrix.cache_suffix }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gpu-drivers:buildcache${{ matrix.cache_suffix }},mode=max

      - name: Build Gstreamer
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/
          file: ${{ matrix.gstreamer_file }}
          push: true
          build-args: |
            GSTREAMER_VERSION=${{ env.GSTREAMER_VERSION }}
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gpu-drivers:${{ env.GPU_DRIVERS_VERSION }}${{ matrix.tag_suffix }}
          tags: ghcr.io/${{ github.repository_owner }}/gstreamer:${{ env.GSTREAMER_VERSION }}${{ matrix.tag_suffix }},gameonwhales/gstreamer:${{ env.GSTREAMER_VERSION }}${{ matrix.tag_suffix }} # TODO: set gstreamer version as param
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gstreamer:buildcache${{ matrix.cache_suffix }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gstreamer:buildcache${{ matrix.cache_suffix }},mode=max

      - name: Build Wolf
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ matrix.wolf_file }}
          push: ${{ steps.prep.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gstreamer:${{ env.GSTREAMER_VERSION }}${{ matrix.tag_suffix }}
            IMAGE_SOURCE=${{ steps.prep.outputs.github_server_url }}/${{ github.repository }}
          cache-from: ${{ steps.prep.outputs.cache_from }}
          cache-to: ${{ steps.prep.outputs.cache_to }}

  test_devcontainer:
    runs-on: ubuntu-latest
    needs: buildx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: steps.prep.outputs.has_github_token != '' # secrets not available in PRs
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run tests in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageTag: devcontainer
          imageName: ghcr.io/${{ github.repository_owner }}/wolf
          cacheFrom: ghcr.io/${{ github.repository_owner }}/wolf:buildcache
          push: never
          # TODO:
