name: Docker build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - ".github/**"
  release:
    types: [published]
  workflow_dispatch:

# Serialize runs that share a ref so concurrent builds cannot race when
# pushing mutable tags (image tags and buildcache refs) to the registry.
# cancel-in-progress: false ensures an in-flight branch build always completes
# before the next one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GPU_DRIVERS_VERSION: 2025.05
  GSTREAMER_VERSION: 1.26.7

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set derived configuration variables:
      # - images: images to build (docker and/or github)
      # - push: if images need to be uploaded to repository (when secrets available)
      # - has_docker_token
      # - has_github_token
      # - cache_from: image tag to use for imported cache
      # - cache_to: image tag to use for exported cache
      # - github_server_url: reference to source code repository
      - name: Prepare
        id: prep
        run: |
          IMAGES=""
          PUSH=false
          REGISTRY_IMAGE="ghcr.io/${{ github.repository_owner }}/wolf"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            IMAGES="gameonwhales/wolf"
            PUSH=true
            echo "has_docker_token=true" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            if [ "$IMAGES" = "" ]; then
              IMAGES="${REGISTRY_IMAGE}"
            else
              IMAGES="$IMAGES,${REGISTRY_IMAGE}"
            fi
            PUSH=true
            echo "has_github_token=true" >> $GITHUB_OUTPUT
            echo "cache_from=type=registry,ref=${REGISTRY_IMAGE}:buildcache" >> $GITHUB_OUTPUT
            echo "cache_to=type=registry,ref=${REGISTRY_IMAGE}:buildcache,mode=max" >> $GITHUB_OUTPUT
          else
            echo "cache_from=type=registry,ref=${REGISTRY_IMAGE}:buildcache" >> $GITHUB_OUTPUT
            echo "cache_to=" >> $GITHUB_OUTPUT
          fi
          echo "images=${IMAGES}" >> $GITHUB_OUTPUT
          echo "push=${PUSH}" >> $GITHUB_OUTPUT
          echo "github_server_url=${GITHUB_SERVER_URL}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: ${{ steps.prep.outputs.images }}
          # generate Docker tags based on the following events and attributes
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=raw,value=alpha
            type=sha
          flavor: latest=false # let's not produce a :latest tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
          version: latest
          driver-opts: image=moby/buildkit:v0.34.0

      - name: Login to DockerHub
        if: steps.prep.outputs.has_docker_token != '' # secrets not available in PRs
        uses: docker/login-action@v4
        with:
          username: abeltramo
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Login to GitHub Container Registry
        if: steps.prep.outputs.has_github_token != '' # secrets not available in PRs
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build GPU Drivers
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/
          file: docker/gpu-drivers.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gpu-drivers:${{ env.GPU_DRIVERS_VERSION }},gameonwhales/gpu-drivers:${{ env.GPU_DRIVERS_VERSION }}
          # No provenance/SBOM attestations on base images: they embed a
          # per-run invocation ID, which changes the manifest list digest on
          # every run and invalidates the downstream FROM cache chain.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gpu-drivers:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gpu-drivers:buildcache,mode=max

      - name: Build Gstreamer
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/
          file: docker/gstreamer.Dockerfile
          push: true
          build-args: |
            GSTREAMER_VERSION=${{ env.GSTREAMER_VERSION }}
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gpu-drivers:${{ env.GPU_DRIVERS_VERSION }}
          tags: ghcr.io/${{ github.repository_owner }}/gstreamer:${{ env.GSTREAMER_VERSION }},gameonwhales/gstreamer:${{ env.GSTREAMER_VERSION }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gstreamer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gstreamer:buildcache,mode=max

      - name: Build Wolf
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: docker/wolf.Dockerfile
          push: ${{ steps.prep.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gstreamer:${{ env.GSTREAMER_VERSION }}
            IMAGE_SOURCE=${{ steps.prep.outputs.github_server_url }}/${{ github.repository }}
          cache-from: ${{ steps.prep.outputs.cache_from }}
          cache-to: ${{ steps.prep.outputs.cache_to }}

      # Smoke-test the image we just pushed: binaries, dynamic linking,
      # compositor plugin + software encoder, embedded PulseAudio, and a full
      # entrypoint boot under supervisord. GPU-dependent elements are not
      # checked (no GPU on CI runners).
      - name: Smoke test image
        if: steps.prep.outputs.push == 'true'
        run: |
          TAG='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          echo "==> Smoke testing $TAG"
          docker pull "$TAG"
          docker run --rm --entrypoint "" \
            -v "$(pwd)/docker/smoke-test.sh:/smoke.sh:ro" \
            "$TAG" bash /smoke.sh

  test_devcontainer:
    runs-on: ubuntu-latest
    needs: buildx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: steps.prep.outputs.has_github_token != '' # secrets not available in PRs
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run tests in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageTag: devcontainer
          imageName: ghcr.io/${{ github.repository_owner }}/wolf
          cacheFrom: ghcr.io/${{ github.repository_owner }}/wolf:buildcache
          push: never
          # TODO:
          # runCmd: |
          #   cmake -Bbuild \
          #         -H$GITHUB_WORKSPACE \
          #         -DCMAKE_BUILD_TYPE=Debug \
          #         -DCMAKE_CXX_EXTENSIONS=OFF \
          #         -DTEST_VIRTUAL_INPUT=OFF \
          #         -DTEST_DOCKER=ON \
          #         -DTEST_RUST_WAYLAND=ON \
          #         -DTEST_NVIDIA=OFF \
          #         -DTEST_EXCEPTIONS=OFF \
          #         -DTEST_UHID=OFF \
          #         -G Ninja
          #
          #   ninja -j $(nproc) wolftests
          #
          #   ./wolftests --reporter JUnit::out=${{runner.workspace}}/report.xml --reporter console::out=-::colour-mode=ansi
