name: PR 396 Fedora image

on:
  push:
    branches:
      - pr-396-fedora-image

env:
  PR_IMAGE_TAG: pr-396-fedora

jobs:
  build_fedora:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
          version: latest
          driver-opts: image=moby/buildkit:master

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build GPU Drivers Fedora
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/
          file: docker/gpu-drivers-fedora.Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/games-on-whales/base-app:fedora
          tags: ghcr.io/${{ github.repository_owner }}/gpu-drivers:${{ env.PR_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Wolf PR 396 Fedora GPU driver base
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gpu-drivers:buildcache-${{ env.PR_IMAGE_TAG }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gpu-drivers:buildcache-${{ env.PR_IMAGE_TAG }},mode=max

      - name: Build GStreamer Fedora
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/
          file: docker/gstreamer-fedora.Dockerfile
          push: true
          build-args: |
            GSTREAMER_VERSION=1.26.7
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gpu-drivers:${{ env.PR_IMAGE_TAG }}
          tags: ghcr.io/${{ github.repository_owner }}/gstreamer:${{ env.PR_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Wolf PR 396 Fedora GStreamer base
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gstreamer:buildcache-${{ env.PR_IMAGE_TAG }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gstreamer:buildcache-${{ env.PR_IMAGE_TAG }},mode=max

      - name: Build Wolf Fedora
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: docker/wolf-fedora.Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gstreamer:${{ env.PR_IMAGE_TAG }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          tags: ghcr.io/${{ github.repository_owner }}/wolf:${{ env.PR_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Wolf PR 396 Fedora image
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wolf:buildcache-${{ env.PR_IMAGE_TAG }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wolf:buildcache-${{ env.PR_IMAGE_TAG }},mode=max
