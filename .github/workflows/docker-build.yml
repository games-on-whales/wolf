name: Docker build

on:
  push:
    paths-ignore:
      - "docs/**"
      - ".github/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/**"

jobs:
  buildx:
    # Avoid running twice for same-repo PRs (push + pull_request). Same-repo
    # branches run on push; fork PRs (which can't trigger push here) run on
    # pull_request, where secrets are unavailable so the build loads the image
    # locally and smoke-tests it instead of pushing. See linux-build-test.yml.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set derived configuration variables:
      # - images: images to build (docker and/or github)
      # - push: if images need to be uploaded to repository (when secrets available)
      # - has_docker_token
      # - has_github_token
      # - cache_from: image tag to use for imported cache
      # - cache_to: image tag to use for exported cache
      # - github_server_url: reference to source code repository
      - name: Prepare
        id: prep
        run: |
          IMAGES=""
          PUSH=false
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            IMAGES="gameonwhales/wolf"
            PUSH=true
            echo "has_docker_token=true" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            REGISTRY_IMAGE="ghcr.io/${{ github.repository_owner }}/wolf"
            if [ "$IMAGES" = "" ]; then
              IMAGES="ghcr.io/${REGISTRY_IMAGE}"
            else
              IMAGES="$IMAGES,ghcr.io/${REGISTRY_IMAGE}"
            fi
            PUSH=true
            echo "has_github_token=true" >> $GITHUB_OUTPUT
            echo "cache_from=type=registry,ref=${REGISTRY_IMAGE}:buildcache" >> $GITHUB_OUTPUT
            echo "cache_to=type=registry,ref=${REGISTRY_IMAGE}:buildcache,mode=max" >> $GITHUB_OUTPUT
          else
            echo "cache_from=type=registry,ref=${REGISTRY_IMAGE}:buildcache" >> $GITHUB_OUTPUT
            echo "cache_to=" >> $GITHUB_OUTPUT
          fi
          echo "images=${IMAGES}" >> $GITHUB_OUTPUT
          echo "push=${PUSH}" >> $GITHUB_OUTPUT
          echo "github_server_url=${GITHUB_SERVER_URL}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          # list of Docker images to use as base name for tags
          images: ${{ steps.prep.outputs.images }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=edge,branch=master
            type=ref,event=branch
            type=raw,value=alpha
            type=sha
          flavor: latest=false # let's not produce a :latest tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
          version: latest
          driver-opts: image=moby/buildkit:master

      - name: Login to DockerHub
        if: steps.prep.outputs.has_docker_token != '' # secrets not available in PRs
        uses: docker/login-action@v2
        with:
          username: abeltramo
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Login to GitHub Container Registry
        if: steps.prep.outputs.has_github_token != '' # secrets not available in PRs
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build GPU Drivers
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/
          file: docker/gpu-drivers.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gpu-drivers:2025.05,gameonwhales/gpu-drivers:2025.05 # TODO: set build version as param
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gpu-drivers:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gpu-drivers:buildcache,mode=max

      - name: Build Gstreamer
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: docker/
          file: docker/gstreamer.Dockerfile
          push: true
          build-args: |
            GSTREAMER_VERSION=1.26.7
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gpu-drivers:2025.05
          tags: ghcr.io/${{ github.repository_owner }}/gstreamer:1.26.7,gameonwhales/gstreamer:1.26.7 # TODO: set gstreamer version as param
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gstreamer:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gstreamer:buildcache,mode=max

      - name: Build Wolf
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: docker/wolf.Dockerfile
          push: ${{ steps.prep.outputs.push }}
          # Load into the local docker daemon when we aren't pushing to a
          # registry (fork PRs, missing secrets) so the smoke-test step
          # below can run `docker image inspect` and `docker run` against
          # the image we just built.
          load: ${{ steps.prep.outputs.push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/gstreamer:1.26.7
            IMAGE_SOURCE=${{ steps.prep.outputs.github_server_url }}/${{ github.repository }}
          cache-from: ${{ steps.prep.outputs.cache_from }}
          cache-to: ${{ steps.prep.outputs.cache_to }}

      # Smoke-test the image we just built. Two ingest paths because the
      # build step's output differs by context:
      #   * push=true  -> registry got the image; `docker pull` fetches it.
      #   * push=false -> `load: true` put it in the local daemon; no fetch.
      # Either way we then invoke bin/test-image.sh, which runs the 3-layer
      # harness (structural + cont-init smoke + docker/tests/smoke.sh).
      - name: Smoke test wolf image
        run: |
          set -euo pipefail
          tag='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          if [[ "${{ steps.prep.outputs.push }}" == "true" ]]; then
            echo "==> pulling ${tag} from registry"
            docker pull "${tag}"
          else
            echo "==> using locally-loaded image (no registry push)"
          fi
          ./bin/test-image.sh "${tag}"

  test_devcontainer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    needs: buildx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: steps.prep.outputs.has_github_token != '' # secrets not available in PRs
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run tests in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageTag: devcontainer
          imageName: ghcr.io/${{ github.repository_owner }}/wolf
          cacheFrom: ghcr.io/${{ github.repository_owner }}/wolf:buildcache
          push: never
          # TODO:
          # runCmd: |
          #   cmake -Bbuild \
          #         -H$GITHUB_WORKSPACE \
          #         -DCMAKE_BUILD_TYPE=Debug \
          #         -DCMAKE_CXX_EXTENSIONS=OFF \
          #         -DTEST_VIRTUAL_INPUT=OFF \
          #         -DTEST_DOCKER=ON \
          #         -DTEST_RUST_WAYLAND=ON \
          #         -DTEST_NVIDIA=OFF \
          #         -DTEST_EXCEPTIONS=OFF \
          #         -DTEST_UHID=OFF \
          #         -G Ninja
          #
          #   ninja -j $(nproc) wolftests
          #
          #   ./wolftests --reporter JUnit::out=${{runner.workspace}}/report.xml --reporter console::out=-::colour-mode=ansi